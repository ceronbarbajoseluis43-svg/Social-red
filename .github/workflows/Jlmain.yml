name: Compilar APK para Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo fuente
      uses: actions/checkout@v4
      
    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permisos de ejecucion a Gradle
      run: chmod +x gradlew

    - name: Construir archivo APK
      run: ./gradlew assembleDebug

    - name: Guardar APK como resultado descargable
      uses: actions/upload-artifact@v4
      with:
        name: MiApp-Uptodown
        path: app/build/outputs/apk/debug/app-debug.apk
        
